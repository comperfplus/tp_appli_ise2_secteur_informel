{% extends "base.html" %}{% block title %}Catégories{% endblock %}{% block content %}
<h1 class="h3 mb-4">Catégories de produits</h1>
<div class="card card-body mb-4"><form method="post" action="{{ url_for('category_add') }}" class="row g-2">
<div class="col-md-9"><input class="form-control" name="libelle" placeholder="Libellé de la catégorie" required></div>
<div class="col-md-3 d-grid"><button class="btn btn-primary">Ajouter</button></div></form></div>
<div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>ID</th><th>Libellé</th><th>Produits</th><th>Actions</th></tr></thead><tbody>
{% for c in data %}<tr><td>{{ c.id_categorie }}</td><td><form class="d-flex gap-2" method="post" action="{{ url_for('category_edit',ident=c.id_categorie) }}"><input class="form-control form-control-sm" name="libelle" value="{{ c.libelle }}" required><button class="btn btn-sm btn-outline-primary">Modifier</button></form></td><td>{{ c.nb }}</td><td><form method="post" action="{{ url_for('category_delete',ident=c.id_categorie) }}" onsubmit="return confirm('Supprimer ?')"><button class="btn btn-sm btn-outline-danger">Supprimer</button></form></td></tr>
{% else %}<tr><td colspan="4" class="text-center">Aucune catégorie.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
