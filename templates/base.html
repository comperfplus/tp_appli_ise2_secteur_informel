<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Gestion commerciale{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4"><div class="container">
<a class="navbar-brand" href="{{ url_for('index') }}">Gestion commerciale</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Accueil</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('categories') }}">Catégories</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('produits') }}">Produits</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('ventes') }}">Ventes</a></li>
</ul></div></div></nav>
<main class="container pb-5">
{% with messages=get_flashed_messages(with_categories=true) %}{% for typ,msg in messages %}
<div class="alert alert-{{ typ }} alert-dismissible fade show">{{ msg }}<button class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main>
<footer class="text-center text-secondary small py-3">TP Master 2 Statistique</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
