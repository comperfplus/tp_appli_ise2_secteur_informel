<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - Gestion commerciale</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; }
    .login-card { width: min(420px, 92vw); border: 0; border-radius: 16px; }
  </style>
</head>
<body>
  <div class="card shadow login-card">
    <div class="card-body p-4 p-md-5">
      <h3 class="text-center mb-2">Gestion commerciale</h3>
      <p class="text-center text-secondary mb-4">Connectez-vous pour accéder à la plateforme</p>

      {% with messages=get_flashed_messages(with_categories=true) %}
        {% for typ,msg in messages %}
          <div class="alert alert-{{ typ }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div class="mb-3">
          <label for="login" class="form-label">Identifiant</label>
          <input id="login" name="login" type="text" class="form-control"
                 autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Mot de passe</label>
          <input id="password" name="password" type="password" class="form-control"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
